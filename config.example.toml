# =============================================================================
# 必填：LLM 配置
# api_key 可以直接填字符串，也可以用 ${ENV_VAR} 引用环境变量。
# =============================================================================

[llm]
provider = "deepseek"

[llm.main]
# 主模型，必填。推荐 deepseek-v4-flash（agent 能力强、价格低）。
model = "deepseek-v4-flash"
api_key = "sk-..."
base_url = "https://api.deepseek.com/v1"
enable_thinking = true
multimodal = false

[llm.fast]
# 轻量模型，用于 memory gate / query rewrite / HyDE。
# 不填则退回主模型，但延迟会稍高。
model = "qwen-flash"
api_key = "sk-..."
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"

[llm.vl]
# 视觉模型，仅在 llm.main.multimodal = false 时需要。
# model 留空则不启用，图片会作为路径传给主模型。
model = "qwen-vl-plus"
api_key = "sk-..."
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"

# =============================================================================
# Agent 行为
# =============================================================================

[agent]
system_prompt = "You are Akashic, a helpful AI assistant with access to tools. Always respond in the same language the user uses."
max_tokens = 8192
# 设为 0 表示不限制迭代轮数；长任务仍可用 /stop 中断。
max_iterations = 40
dev_mode = false

[agent.context]
memory_window = 40

[agent.tools]
search_enabled = true

# 可选：长期记忆整理任务（默认已启用，通常无需修改）
# [agent.maintenance]
# memory_optimizer_enabled = true
# memory_optimizer_interval_seconds = 64800

# 可选：控制加载哪些工具集（默认值适合大多数场景）
# [agent.wiring]
# toolsets = ["meta_common", "spawn", "schedule", "mcp"]

# =============================================================================
# 必填：至少配置一个频道（Telegram 或 QQ 选其一）
# token / bot_uin 为空时该频道自动跳过，不会报错。
# =============================================================================

[channels.telegram]
# BotFather 给的 bot token，格式：123456789:AAF...
token = ""
# 你的 Telegram 用户名（不带 @），只有白名单用户才能使用 bot。
allow_from = ["your_username"]
# channel 标识符，决定 session key 前缀（如 telegram:12345）。
# 多个 bot 想要隔离记忆时，改成不同的名字（如 "telegram_work"）。
# channel_name = "telegram"

[channels.feishu]
# 飞书群自定义机器人 webhook。配置后可通过 message_push/proactive 向飞书群发文本。
# 获取方式：飞书群设置 -> 群机器人 -> 添加机器人 -> 自定义机器人。
enabled = false
webhook_url = "${FEISHU_WEBHOOK_URL}"
# 如果自定义机器人开启了“签名校验”，填对应密钥；未开启则留空。
secret = "${FEISHU_WEBHOOK_SECRET}"
channel_name = "feishu"

[channels.wechat]
# 企业微信/微信群机器人 webhook。配置后可通过 message_push/proactive 向微信群发文本。
# 获取方式：企业微信群 -> 群机器人 -> 添加机器人，复制 webhook 地址。
enabled = false
webhook_url = "${WECHAT_WEBHOOK_URL}"
# 可选：企业微信机器人支持通过 user id 或手机号 @成员；填 "@all" 可 @所有人。
mentioned_list = []
mentioned_mobile_list = []
channel_name = "wechat"

[channels.qq]
# 填 QQ 号启用 QQ 频道，留空跳过。
bot_uin = ""
allow_from = ["your_qq_number"]
# bot_peer_ids 内的账号需要带 peer_trigger_prefixes 才会触发，避免多机器人循环。
bot_peer_ids = []
peer_trigger_prefixes = ["/ask", "/akashic", "Akashic:", "ak:"]
websocket_open_timeout_seconds = 5.0
channel_name = "qq"
websocket_uri = "ws://localhost:3001"
websocket_token = "NcatBot"

# 可选：第二个 NapCat/QQ 账号。需要单独容器和端口。
# 多账号互发时，Akashic 会记录近期出站内容并忽略回流，防止两个机器人来回回复。
# [[channels.qq.accounts]]
# bot_uin = "2365524513"
# allow_from = ["1049511700"]
# bot_peer_ids = ["1049511700", "2365524513"]
# peer_trigger_prefixes = ["/ask", "/akashic", "Akashic:", "ak:"]
# websocket_open_timeout_seconds = 5.0
# channel_name = "qq_2365524513"
# websocket_uri = "ws://localhost:3002"
# websocket_token = "NcatBot"

# 可选：允许在群组中使用（@bot 触发）
# [[channels.qq.groups]]
# group_id = "123456789"
# allow_from = ["your_qq_number"]
# require_at = true

[channels.qqbot]
# 官方 QQBot，和 NapCat QQ 通道并存。留空跳过。
app_id = ""
client_secret = ""
# 私聊白名单使用官方 user_openid。
allow_from = []

# 当前实现仅启用私聊；群配置先保留为后续扩展占位。
# [[channels.qqbot.groups]]
# group_openid = "GROUP_OPENID"
# allow_from = ["MEMBER_OPENID"]
# require_at = true
# allow_proactive = false

# =============================================================================
# 语义记忆
# default memory 的检索阈值在 plugins/default_memory/config.local.toml。
# =============================================================================

[memory]
enabled = true
# 语义记忆 engine 选择。留空等同 default。
engine = ""

[memory.embedding]
model = "text-embedding-v3"
api_key = "sk-..."
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"

# =============================================================================
# 主动推送（可选）
# 先跑通基本对话再开启这部分。
# =============================================================================

[proactive]
# 开启后 agent 会主动向你推送消息。需要先填好下方 chat_id 再设为 true。
enabled = false
profile = "daily"

[proactive.target]
channel = "telegram"
# 你的 Telegram user id（向 bot 发一条消息后从日志里可以拿到）。
# 官方 QQBot 私聊可填：channel = "qqbot"，chat_id = "c2c:USER_OPENID"
chat_id = ""

[proactive.agent]
max_steps = 35
content_limit = 5
web_fetch_max_chars = 8000
context_prob = 0.03
delivery_cooldown_hours = 1

[proactive.drift]
# Drift：无可推送内容时 agent 自主做任务。建议先跑通 proactive 再开启。
enabled = false
max_steps = 20
min_interval_hours = 3

# =============================================================================
# 其他集成（可选）
# =============================================================================

[integrations.fitbit]
enabled = false

[integrations.chatgpt_proxy]
# 单独的 OpenAI-compatible 图片生成端点；不影响主 LLM 配置。
# base_url 通常形如 http://127.0.0.1:8000/v1。
enabled = false
base_url = "${CHATGPT_PROXY_BASE_URL}"
api_key = "${CHATGPT_PROXY_API_KEY}"
image_model = "gpt-image-1"
image_path = "/images/generations"
response_format = "b64_json"
output_dir = "generated_images"

[integrations.ragflow]
# RAGFlow 作为多来源数据的统一 RAG 后端。
# 先启动 RAGFlow，再在 UI 中创建 API key 和 dataset。
enabled = false
base_url = "http://127.0.0.1:9380"
api_key = "${RAGFLOW_API_KEY}"
# 你的代理端口：RAGFlow 客户端访问外部/远端 RAGFlow 时走这里；本机 9380 通常不需要。
proxy_url = "http://127.0.0.1:7897"
default_dataset_ids = []
default_keyword = true
default_use_kg = false
default_top_k = 1024
default_page_size = 8
default_similarity_threshold = 0.2
default_vector_similarity_weight = 0.3
request_timeout_seconds = 60

[integrations.shadow_gateway]
# Phase 2 shadow mode：旁路镜像 Python 入站消息到 Go message-gateway。
# 默认关闭；启用后仍不改变现有回复路径。
enabled = false
endpoint = "http://127.0.0.1:8780/v1/shadow/inbound"
log_path = "shadow/inbound.jsonl"
request_timeout_seconds = 2
agent_id = "shadow"

# 可选：接入外部 Peer Agent（如 DeepResearch）
